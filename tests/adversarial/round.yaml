# #061 阶段 2 默认配置。缺任一字段时 run_round.load_config 用同名默认值补上。
red:  {base: http://172.28.29.24:30032/v1, model: qwen3.8-27b, timeout_s: 120}
blue: {base: http://172.28.50.9:30030/v1, model: Qwen3.8-27B, temperature: 0.7}
match: {games: 1, mode: fixed, questions: 10, target_score: 20, max_questions: 60, max_followups: 3, seed: 42}
retry: {per_question: 2, backoff_s: [5, 20]}
kb:   {seed_path: data/sdwan-new.md, work_dir: runs/adversarial/kb}
broadcast: {enabled: true, group: "kf红蓝对抗直播", level: all, max_per_sec: 2, relay_every_s: 60}
mode: program
publish: {git_branch: adversarial-logs, push: true}
scope: ["SDWAN", "直播线路", "带宽", "IP", "备案", "域名"]
# #062 第二节：拼车/共享IP 及错字变体进规则层（二-3，不走模型）
scope_patterns: ["拼[车彻扯多]",
                 "[几0-9一二三四五六七八九十百]+[个入]?人?[拼平拚](?!时|常|均|稳|安|凡|淡|衡|静|易)",
                 "共享\\s*IP"]
# 检索强相关阈值（第八节4）：定标依据见 classify.SCOPE_RELEVANCE_MIN 注释
# （#061 四道误判题检索第一名最低 40.9、五道真范围外探针最高 7.8）
scope_relevance_min: 20.0
# 兜底「拿不准判范围内」：任务书七要求第三节规则实现后才许开；第三节落地时改 true
scope_uncertain_in: false
stall_s: 600

# 阶段 5：held-out 封存题复测（局末自动，任务书 :187）。enabled 由 Chief 定首次真跑时机
heldout: {enabled: false, questions: 10}

# 阶段 5：开放题计分开关。校准（docs/校准-061-开放题.md 一致率 ≥85%）通过前保持 false：
# open_question 题只记录不计分（classify verdict=open）
scoring: {open_questions: false}
